# grype configuration for the production image scan (SDD stage 4: syft, then grype --fail-on high).
#
# Finding B1 (docs/security/accepted-risks.md, 2026-11-21): FALSE POSITIVES, settled by fp-check against the Debian security
# tracker. grype's binary matcher reads the upstream version string of /usr/bin/openssl ("3.5.7"); Debian backports fixes
# without changing it. Both CVEs are recorded FIXED for trixie in openssl 3.5.7-1~deb13u2 (DSA-6465-1), and the image carries
# 3.5.7-1~deb13u3 or newer. grype's own Debian-package matcher does not report either CVE against that package.
# Each rule is scoped to the binary artifact at that version, so a real match on the deb package, or another version, still
# reports. Remove a rule if the image's OpenSSL changes or the tracker entry changes.
ignore:
  - vulnerability: CVE-2026-63073
    package:
      name: openssl
      version: 3.5.7
      type: binary
  - vulnerability: CVE-2026-75803
    package:
      name: openssl
      version: 3.5.7
      type: binary
