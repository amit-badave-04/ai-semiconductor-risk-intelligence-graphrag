ching text in the newer filing; parts of their content may be covered inside other risk factors):\n- \"Older risk 1\" [0001045810-25-000023:I.1A:0001]\n- \"Older risk 2\" [0001045810-25-000023:I.1A:0002]\n- \"Older risk 3\" [0001045810-25-000023:I.1A:0003]\nNo matching risk factor found in the earlier filing - showing 0 of 12 risk factors (new, or a restructured older risk factor):\nReworded - showing 0 of 9 risk factors (still disclosed, wording changed):\n\n=== SOURCE EXCERPTS ===\n[0001045810-26-000021:I.1A:0040]\nWe depend on foundries such as TSMC to manufacture our GPUs. Export controls restrict sales of certain advanced chips to China and may materially affect our data center revenue.\n\n",
