[project]
name = "semigraph"
version = "0.1.0"
description = "AI Semiconductor Risk Intelligence GraphRAG SDK (SEC EDGAR + BIS export controls -> bitemporal Neo4j graph -> cited answers)"
requires-python = ">=3.12"
dependencies = [
    "edgartools>=5.40.1",
    "litellm>=1.90.2",
    "neo4j>=6.2.0",
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "sec-parser>=0.58.1",
    "sentence-transformers>=5.6.0",
    "tiktoken>=0.13.0",
    "typer>=0.16.0",
]

[project.optional-dependencies]
# second-scorer evaluation stack (M6 backlog: judge diversity)
eval = ["ragas>=0.4.3"]
# web service (semigraph.serve): FastAPI + torch-free ONNX query embeddings
serve = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "onnxruntime>=1.29",
    "tokenizers>=0.21",
    "sse-starlette>=2.0",
    "httpx>=0.28",
]

[project.scripts]
semigraph = "semigraph.cli:app"

[dependency-groups]
dev = [
    "onnx>=1.17",  # scripts/build_onnx_embedder.py (weight-only quantization of the query embedder)
    "onnx-ir>=1.0",  # required by onnxruntime.quantization.matmul_nbits_quantizer
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.6.1",
    "matplotlib>=3.11.0",
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semigraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
