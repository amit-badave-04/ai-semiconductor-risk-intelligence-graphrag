# Fly.io config — semigraph web service. Always-warm while online (like the
# voice agent): a cold start costs ~10 s (machine boot + 1 GB embedder load +
# Neo4j connect), which made every first visit slow. Cost is controlled by the
# STOP script (scale to 0) instead of by idle auto-stop.
# The database is the separate app semigraph-neo4j (deploy/neo4j), reached
# over the private network; see docs/RUNBOOK.md for START / STOP.
app = "semigraph"
primary_region = "sin"
swap_size_mb = 1024

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  EMBEDDING_BACKEND = "onnx"
  ONNX_MODEL_PATH = "/srv/models/qwen3-embedding-0.6b-q8/model_q8.onnx"
  ONNX_THREADS = "1"
  LLM_ANSWER_MAX_TOKENS = "2400"
  # Answering models (the code default for ANSWER_MODEL stays Sonnet so local runs are Sonnet; production is
  # reproducible from the repo). The provider keys (OPENAI_API_KEY, ANTHROPIC_API_KEY) are Fly secrets.
  # Revert to Sonnet only: ANSWER_MODEL = "anthropic/claude-sonnet-5" and ESCALATION_MODEL = "" (docs/RUNBOOK.md).
  ANSWER_MODEL = "openai/gpt-6-luna"
  ESCALATION_MODEL = "anthropic/claude-sonnet-5"
  # The Fly edge proxy sets this from the real connection; never trust it elsewhere.
  CLIENT_IP_HEADER = "fly-client-ip"
  # Opt-in retrieval-planning agent (strategy=agent), docs/RUNBOOK.md "The M3 agent" / docs/v2/M3_AGENT_PLAN.md section 7.
  # Enabled 2026-09-27 after a live paid ship-gate evaluation showed no regression vs the fixed path. Revert: set "false".
  AGENT_ENABLED = "true"
  # M4 (docs/RUNBOOK.md "Freshness monitor" / "Upload workspaces"). SEC_USER_AGENT is a Fly SECRET (it names a real person).
  # Revert either feature: set it to "false" and redeploy (workspaces still expire on schedule: the sweeper always runs).
  FRESHNESS_ENABLED = "true"
  UPLOADS_ENABLED = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[vm]]
  # M4 (owner decision 2026-09-29, "Bigger machine"): 2 shared vCPUs / 4 GB so an upload embeds on one core while live
  # questions use the other (docs/v2/M4_PLAN.md sections 3, 13). Back to shared-cpu-1x / 2gb only with UPLOADS_ENABLED=false.
  size = "shared-cpu-2x"
  memory = "4gb"

[checks]
  [checks.health]
    type = "http"
    port = 8080
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "180s"  # DB retry window (90 s) + embedder load
