# Freshness monitor heartbeat (M4, docs/v2/M4_PLAN.md 4.1, G5). A public, read-only GET — no ADMIN_TOKEN in GitHub,
# no secret at all. The app being asleep (the owner's STOP scales the API machine to zero on purpose) is a
# ::warning:: and a green run, never a failure; only a body whose status is error/stale/unconfigured fails the job.
#
# GitHub runs `schedule` and the first `workflow_dispatch` only from the DEFAULT branch, so this workflow is inert
# on `v2` and activates once `v2` lands on `master` (M6) — expected, not a bug to chase here.
name: freshness-heartbeat

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Least privilege: the one job only reads the repository (checkout) and makes a public GET, so nothing needs a write scope.
# Both actions are pinned to the same full commit SHAs as tests.yml, with the release in a trailing `# vX.Y.Z` comment (a tag can be
# moved), and the checkout leaves no token in .git/config (tests/test_workflow_pins.py pins all three for every workflow file).
permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Check GET /api/freshness
        run: python scripts/freshness_heartbeat.py https://semigraph.fly.dev/api/freshness
