# Pure-logic tests on every push (LLM mocked, no Neo4j, no API spend) plus
# supply-chain and secret hygiene, mirroring the clinic-voice-agent workflow.
# The benchmark (paid) and the ONNX fidelity build stay manual.
name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --extra serve
      - run: uv run pytest -q

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependency vulnerability audit (advisory)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r deploy/requirements-serve.txt
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
