# Pure-logic tests on every push (LLM mocked, no Neo4j, no API spend) plus
# supply-chain and secret hygiene, mirroring the clinic-voice-agent workflow.
# The benchmark (paid) and the ONNX fidelity build stay manual.
#
# Two dependency sets are under test on purpose:
#   unit          the developer set (uv.lock: the SDK, the pipeline and the serve extra)
#   serve-shipped exactly what the API image installs (deploy/requirements-serve.txt, e.g. litellm 1.100.0),
#                 so a shipped dependency cannot drift from what CI exercised.
#
# serve-shipped has NO pandas or sentence-transformers (it does ship rapidfuzz and scipy since M4: the upload what-changed
# comparison uses graph/alignment.py in a sandboxed subprocess). A test module its selection matches by name that needs a missing
# package starts with pytest.importorskip(...) and states why; eval and pipeline tests live in files the selection does not match.
# The three files named at the end of the selection are not matched by a pattern: the provider-base kwargs of every serve-path
# model call, the meter keyword every answer twin must declare, and the embedder's fp32/q8 loading (its five tests that need `onnx`,
# a developer package, skip themselves). Tests whose subject is the harness (test_tools_*, test_staging_*, test_loadtest_*,
# test_latency_smoke, test_check_chars_per_token) cover files the image does not ship and run in `unit` only.
# Reproduce it on a developer machine (a throwaway venv outside the repo, then the pytest command of the step below):
#   uv venv <tmp>/sv --python 3.13
#   uv pip install --python <tmp>/sv/Scripts/python.exe -r deploy/requirements-serve.txt pytest    (bin/python on Linux/macOS)
#   uv pip install --python <tmp>/sv/Scripts/python.exe --no-deps -e .
# On GitHub Actions typer renders CLI errors as a wrapped, coloured box; CLI tests assert on tests/cliout.plain(result.output).
#
# web is the frontend (web/, docs/specs/m5b-frontend.md R14): lint, type-check, unit tests with coverage thresholds, audit, build, the
# dist contract against the server's unchanged CSP, then Playwright + axe and Lighthouse against the fixture server
# (tests/e2e/serve_fixture_app.py: the real routers over fakes, no Neo4j, no LLM), and the Docker web stage. Node comes from
# web/.node-version; the only install is `npm ci --ignore-scripts` from the lockfile (created on Linux).
name: tests

on:
  push:
    branches: [master, main, v2]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v7        # the page's pure functions are tested with `node --test` (no npm install)
        with:
          node-version: "24.22.2"          # one Node everywhere: web/.node-version, the Dockerfile, the web job (tests/test_web_pins.py)
      - run: uv python install 3.13
      - run: uv sync --extra serve --extra agent      # the agent extra (langgraph) is opt-in in production; CI tests it
      - run: uv run pytest -q

  # The DeepEval wrapper (src/semigraph/eval/deepeval_metrics.py) in its own environment: deepeval pins click<8.4 and installs pytest
  # plugins that load in EVERY session, so it is neither a project dependency nor in the lock. The unit job skips those 12 tests.
  deepeval-wrapper:
    runs-on: ubuntu-latest
    env:
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      DEEPEVAL_DISABLE_DOTENV: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --extra serve --extra agent
      # This intentionally installs a click version outside uv.lock, inside this isolated job only: expected and harmless, not a bug to "fix".
      - run: uv pip install "deepeval>=4.2.6,<5"
      - run: uv run --no-sync pytest -q -p no:deepeval tests/test_agent_eval_deepeval.py

  serve-shipped:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: deploy/requirements-serve.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.2"
      - name: Install the API image's pinned dependencies, pytest, and the package without its dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r deploy/requirements-serve.txt pytest
          pip install --no-deps -e .
          python -c "import importlib.metadata as m; print('litellm', m.version('litellm'))"
      - name: Serving-side tests against the shipped dependency set
        run: >
          pytest -q -rs
          tests/test_serve_*.py tests/test_state_*.py tests/test_escalation.py tests/test_verify*.py tests/test_router.py
          tests/test_ids.py tests/test_llm_shape.py tests/test_answerer_*.py tests/test_answer_checks_events.py
          tests/test_retrieval_*.py tests/test_static_ui.py
          tests/test_llm_provider_kwargs.py tests/test_agent_seam.py tests/test_embeddings_onnx_variant.py
      # M4 spike S3 (docs/v2/M4_PLAN.md section 8): the upload parse sandbox under its real RLIMIT_AS on Linux, with the child's
      # peak RSS printed into this log (the step above captures output; this one shows it and fails if the test is skipped).
      - name: Upload parse sandbox under RLIMIT_AS (Linux-only measurement)
        run: >
          pytest -q -s -rs
          "tests/test_serve_upload_parse.py::test_max_size_pdf_parses_under_rlimit_as_and_reports_child_rss"
          | tee s3.log && grep -q "1 passed" s3.log
      # M4 section 1/16 extension: the "comparing" stage now runs the frozen aligner (scipy/rapidfuzz) in its own
      # sandboxed subprocess too (uploads/sandbox.py, uploads/compare_worker.py); same shape as the parse-sandbox
      # step above, on the 30-page max-size fixture pair, with the child's peak RSS printed into this log.
      - name: Upload compare sandbox under RLIMIT_AS (Linux-only measurement)
        run: >
          pytest -q -s -rs
          "tests/test_serve_upload_compare.py::test_max_size_pair_compares_under_rlimit_as_and_reports_child_rss"
          | tee s4.log && grep -q "1 passed" s4.log

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The fixture server is Python (the real serve routers over fakes), so this job sets Python up as the unit job does.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --extra serve --extra agent
      - name: Install exactly the lockfile, install scripts off
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Lint (oxlint; the HTML-sink rules are errors)
        working-directory: web
        run: npm run lint
      - name: Type-check (tsc -b)
        working-directory: web
        run: npm run typecheck
      - name: Unit tests with the coverage thresholds
        working-directory: web
        run: npm run test:coverage
      - name: Dependency audit (high and above fail)
        working-directory: web
        run: npm run audit
      - name: Build
        working-directory: web
        run: npm run build
      # R4 / R30: the build output against the server's unchanged CSP. The real-dist leg SKIPS without web/dist and a skip
      # would be vacuous here, so any SKIPPED line fails the step (pytest -rs prints each one).
      - name: Dist contract
        shell: bash
        run: |
          uv run pytest -q -rs tests/test_dist_contract.py | tee dist-contract.log
          ! grep -E "^SKIPPED" dist-contract.log
      - name: Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Playwright and axe against the fixture server
        working-directory: web
        run: npm run e2e
      - name: Lighthouse against the fixture server (accessibility 95, best-practices 90)
        working-directory: web
        run: npm run lighthouse
      - name: Lighthouse baseline of the old page (S8, recorded, not gated)
        working-directory: web
        run: npm run lighthouse -- --legacy
      - name: Docker web stage builds
        run: docker build --target web -t semigraph-web-stage .

  # The paid-ask state package against a REAL Neo4j Community (M5a I4a): what a fake cannot show: the ledger Cypher, the
  # lock behaviour, a held lock cut at the server's transaction timeout, an unreachable server. These tests are opt-in
  # (RUN_NEO4J_TESTS=1 and SEMIGRAPH_ALLOW_WIPE=1) and HARD-PINNED to a throwaway instance on port 7898 (127.0.0.1 in the
  # state tests, localhost in the null test), whatever NEO4J_URI says, so the service container publishes its bolt port
  # there. The password is a disposable value of this throwaway container, not a secret: the tests hard-code it too.
  # Single underscores in NEO4J_db_transaction_monitor_check_interval: the setting has no underscore in it (see the
  # comment in deploy/neo4j/fly.toml); at the 2 s default the held-lock bound the tests pin could not hold.
  neo4j-state:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      neo4j:
        image: neo4j:2026.07.1-community
        env:
          NEO4J_AUTH: neo4j/itest-throwaway-only  # gitleaks:allow
          NEO4J_db_transaction_monitor_check_interval: 100ms
        ports:
          - 7898:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p itest-throwaway-only 'RETURN 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 20s
    env:
      RUN_NEO4J_TESTS: "1"
      SEMIGRAPH_ALLOW_WIPE: "1"
      NEO4J_URI: bolt://localhost:7898
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: itest-throwaway-only  # gitleaks:allow
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --extra serve
      - name: Wait for Neo4j to accept bolt connections
        run: |
          for attempt in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/7898) 2>/dev/null; then echo "bolt is up after $attempt attempt(s)"; exit 0; fi
            sleep 2
          done
          echo "Neo4j did not open port 7898" >&2
          exit 1
      - name: State tests against the real Neo4j
        shell: bash   # an explicit bash runs with -e and pipefail: a failing pytest fails the step through the tee
        run: |
          uv run pytest -q -rs tests/test_state_contract.py tests/integration/test_state_neo4j.py \
            tests/integration/test_null_legacy_ip_hashes_neo4j.py | tee neo4j-state.log
          # These tests skip themselves when the server is unreachable or the opt-in variables are missing, and a skip is not
          # a failure: refuse a run that never reached the server. Once the server is up NO test here has a legitimate reason
          # to skip, whatever the reason it prints, so any skip fails the job (pytest -rs prints each as a SKIPPED line).
          ! grep -E "^SKIPPED" neo4j-state.log

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependency vulnerability audit (advisory)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r deploy/requirements-serve.txt
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
